apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: grafana
    namespace: argocd
    labels:
        app.kubernetes.io/name: grafana
spec:
    project: default
    source:
        repoURL: https://github.com/clementtrecourt/homelab-stack.git
        targetRevision: feat/monitoring
        path: kubernetes/apps/grafana
    destination:
        server: https://kubernetes.default.svc
        namespace: grafana
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
