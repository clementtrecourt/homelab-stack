apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: clem-ops-wildcard
  namespace: kube-system
spec:
  secretName: clem-ops-org-tls 
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  commonName: "*.clem-ops.org"
  dnsNames:
    - "clem-ops.org"
    - "*.clem-ops.org"