apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: kyverno
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  chart: kyverno
  repo: https://kyverno.github.io/kyverno/
  targetNamespace: kyverno
  createNamespace: true
  valuesContent: |-
    admissionController:
      container:
        resources:
          limits:
            memory: 512Mi 
          requests:
            cpu: 100m
            memory: 256Mi
   
      startupProbe:
        failureThreshold: 30 
        periodSeconds: 10    
    
    backgroundController:
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 128Mi