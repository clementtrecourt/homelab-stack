apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ingress
  namespace: argocd
  annotations:
    # 1. Autoriser l'entrée web (80)
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    # 2. Forcer Traefik à parler en HTTPS avec le pod ArgoCD (requis par Argo)
    traefik.ingress.kubernetes.io/service.serversscheme: https
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - argocd.clem-ops.org
    secretName: clem-ops-org-tls
  rules:
  - host: argocd.clem-ops.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 443 # Important : on pointe vers le port HTTPS du service
