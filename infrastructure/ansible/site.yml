---
- name: Hardening et Préparation OS
  hosts: all
  become: yes
  roles:
    - common
    - users

- name: Préparation Stockage (NFS)
  hosts: k3s_workers
  become: yes
  vars:
    nfs_server: "192.168.1.120"
    nfs_export: "/data"
    mount_point: "/mnt/data"
  roles:
    - nfs_client

- name: Installation Control Plane (K3s Master)
  hosts: k3s_master
  become: yes
  roles:
    - k3s_master

- name: Installation Agents (K3s Workers)
  hosts: k3s_workers
  become: yes
  vars:
    master_token: "{{ hostvars[groups['k3s_master'][0]]['k3s_token'] }}"
    master_ip: "{{ hostvars[groups['k3s_master'][0]]['ansible_host'] }}"
  roles:
    - k3s_worker

- name: Bootstrap GitOps (ArgoCD)
  hosts: k3s_master
  become: yes
  roles:
    - bootstrap