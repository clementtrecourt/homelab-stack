---
- hosts: all
  become: yes
  roles:
    - common

- hosts: k3s_master
  become: yes
  roles:
    - k3s_master

- hosts: k3s_workers
  become: yes
  vars:
    master_ip: "{{ hostvars[groups['k3s_master'][0]]['ansible_host'] }}"
  roles:
    - k3s_worker

- hosts: k3s_master
  become: yes
  roles:
    - bootstrap