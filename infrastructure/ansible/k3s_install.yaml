---
- name: Prepare Nodes (Common)
  hosts: all
  become: yes
  tasks:
    - name: Install Dependencies
      package:
        name: 
          - curl
          - ca-certificates
          - nfs-common
        state: present

- name: Installer K3s Master
  hosts: k3s_master
  become: yes
  vars:
    # Pin the version!
    k3s_version: "v1.28.4+k3s2" 
  tasks:
    - name: Installation Master
      shell: >
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} sh -s - server 
        --write-kubeconfig-mode 644 
        --node-name {{ inventory_hostname }} 
        --tls-san {{ ansible_host }} 
        disable traefik 
        disable servicelb
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for node-token
      wait_for:
        path: /var/lib/rancher/k3s/server/node-token

    - name: Read node-token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token_b64

    # Save facts so they are available to other plays in this run
    

    - name: Créer le point de montage
      file:
        path: /mnt/media
        state: directory
        mode: '0755'
    
    - name: Monter le disque dur
      mount:
        path: /mnt/media
        src: /dev/sdb1
        fstype: ext4
        state: mounted

    - name: Donner les permissions (pour éviter les problèmes 'Permission Denied')
      file:
        path: /mnt/media_hdd
        state: directory
        recurse: yes
        owner: 1000 
        group: 1000
        mode: '0775'

- name: Installer K3s Workers
  hosts: k3s_workers
  become: yes
  vars:
    k3s_version: "v1.28.4+k3s2"
  tasks:
    - name: Join Cluster
      shell: >
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} 
        K3S_URL=https://{{ hostvars['localhost']['global_master_ip'] }}:6443 
        K3S_TOKEN={{ hostvars['localhost']['global_join_token'] }} 
        sh -s - agent --node-name {{ inventory_hostname }}
      args:
        creates: /usr/local/bin/k3s-agent