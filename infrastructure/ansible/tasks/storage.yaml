- name: Mount remote NFS share
  hosts: k3s_workers
  become: yes

  vars:
    nfs_server: "192.168.1.120"
    nfs_export: "/data"
    mount_point: "/mnt/data"

  tasks:
    - name: Install NFS client package
      ansible.builtin.apt:
        name: nfs-common
        state: present
        update_cache: yes

    - name: Create mount directory
      ansible.builtin.file:
        path: "{{ mount_point }}"
        state: directory
        mode: '0755'

    - name: Mount NFS share
      ansible.posix.mount:
        path: "{{ mount_point }}"
        src: "{{ nfs_server }}:{{ nfs_export }}"
        fstype: nfs4
        opts: rw,_netdev,hard,timeo=600,retrans=5
        state: mounted