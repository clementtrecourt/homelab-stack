---
- name: Créer le dossier de configuration K3s
  file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'

- name: Déposer la configuration K3s Master
  template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml

- name: Installer K3s sur le Master
  shell: curl -sfL https://get.k3s.io | sh -
  environment:
    INSTALL_K3S_EXEC: "server"

- name: Attendre que le node soit prêt
  command: k3s kubectl get node {{ inventory_hostname }}
  register: node_status
  until: '" Ready " in node_status.stdout'
  retries: 10
  delay: 5

- name: Récupérer le Token pour les Workers
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_base64

- name: Sauvegarder le token dans les facts
  set_fact:
    k3s_token: "{{ k3s_token_base64.content | b64decode | trim }}"

- name: Register Global Token
  set_fact:
    global_join_token: "{{ node_token_b64.content | b64decode | trim }}"
    global_master_ip: "{{ ansible_host }}"
  delegate_to: localhost
  delegate_facts: true

- name: Get Kubeconfig for local use
  fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: ./k3s_kubeconfig
    flat: yes
- name: Récupérer le kubeconfig depuis le master
  fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /tmp/k3s.yaml
    flat: yes

- name: Installer le kubeconfig dans ~/.kube/config
  copy:
    src: /tmp/k3s.yaml
    dest: ~/.kube/config
    mode: '0600'
  delegate_to: localhost
  become: no

- name: Remplacer 127.0.0.1 par l'IP du Master dans la config
  replace:
    path: ~/.kube/config
    regexp: '127\.0\.0\.1'
    replace: "{{ ansible_host }}"
  delegate_to: localhost
  become: no