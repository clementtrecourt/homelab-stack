---
- name: S'assurer que les dépendances Python pour K8s sont là 
  ansible.builtin.pip:
    name:
      - kubernetes
      - PyYAML

- name: Installer Helm
  ansible.builtin.unarchive:
    src: https://get.helm.sh/helm-v3.12.0-linux-amd64.tar.gz
    dest: /usr/local/bin
    remote_src: yes
    extra_opts: "--strip-components=1"
    creates: /usr/local/bin/helm

- name: Ajouter le repo Helm ArgoCD
  kubernetes.core.helm_repository:
    name: argoproj
    repo_url: "https://argoproj.github.io/argo-helm"

- name: Installer ArgoCD via Helm
  kubernetes.core.helm:
    name: argocd
    chart_ref: argoproj/argo-cd
    release_namespace: argocd
    create_namespace: true
    values:
      server:
        extraArgs: ["--insecure"]

- name: Attendre qu'ArgoCD soit opérationnel
  kubernetes.core.k8s_info:
    kind: Deployment
    name: argocd-server
    namespace: argocd
  register: argocd_status
  until: argocd_status.resources[0].status.readyReplicas | default(0) > 0
  retries: 30
  delay: 10

- name: Appliquer la Root Application (Bootstrap GitOps)
  kubernetes.core.k8s:
    state: present
  
    definition: "{{ lookup('file', playbook_dir + '/../kubernetes/root-app.yaml') }}"