---
- name: Installer Helm
  unarchive:
    src: https://get.helm.sh/helm-v3.12.0-linux-amd64.tar.gz
    dest: /usr/local/bin
    remote_src: yes
    extra_opts: "--strip-components=1"
    creates: /usr/local/bin/helm

- name: Ajouter le repo Helm ArgoCD
  kubernetes.core.helm_repository:
    name: argoproj
    repo_url: "https://argoproj.github.io/argo-helm"

- name: Installer ArgoCD
  kubernetes.core.helm:
    name: argocd
    chart_ref: argoproj/argo-cd
    release_namespace: argocd
    create_namespace: true
    values:
      server:
        extraArgs: ["--insecure"]

- name: Attendre que l'API ArgoCD soit prête
  kubernetes.core.k8s_info:
    kind: Deployment
    name: argocd-server
    namespace: argocd
  register: argocd_status
  until: argocd_status.resources[0].status.readyReplicas | default(0) > 0
  retries: 20
  delay: 10

- name: Appliquer la Root Application 
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('file', '../../kubernetes/root-app.yaml') }}"