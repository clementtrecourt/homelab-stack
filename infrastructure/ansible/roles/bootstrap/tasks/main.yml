---
- name: Installer dépendances Python K8s via apt
  ansible.builtin.apt:
    name:
      - python3-kubernetes
      - python3-yaml
    state: present
    update_cache: yes

- name: Copier kubeconfig pour root
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /root/.kube/config
    remote_src: yes
    mode: '0600'

- name: Installer Helm
  ansible.builtin.unarchive:
    src: https://get.helm.sh/helm-v3.12.0-linux-amd64.tar.gz
    dest: /usr/local/bin
    remote_src: yes
    extra_opts: "--strip-components=1"
    creates: /usr/local/bin/helm

- name: Ajouter le repo Helm ArgoCD
  kubernetes.core.helm_repository:
    name: argoproj
    repo_url: "https://argoproj.github.io/argo-helm"

- name: Installer ArgoCD via Helm
  kubernetes.core.helm:
    name: argocd
    chart_ref: argoproj/argo-cd
    release_namespace: argocd
    create_namespace: true
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    values:
      global:
        nodeSelector: 
          kubernetes.io/os: linux
      
      server:
        extraArgs: ["--insecure"]

- name: Attendre qu'ArgoCD soit opérationnel
  kubernetes.core.k8s_info:
    kind: Deployment
    name: argocd-server
    namespace: argocd
  register: argocd_status
  until: argocd_status.resources[0].status.readyReplicas | default(0) > 0
  retries: 30
  delay: 10

- name: Appliquer la Root Application (Bootstrap GitOps)
  kubernetes.core.k8s:
    state: present
  
    definition: "{{ lookup('file', playbook_dir + '/../../kubernetes/root-app.yaml') }}"