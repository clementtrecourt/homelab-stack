---
- name: Créer le dossier de configuration K3s
  file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'
- name: DEBUG TOKEN
  debug:
    var: k3s_shared_token

- name: Installer K3s sur le Worker
  shell: |
    curl -sfL https://get.k3s.io | K3S_URL=https://{{ master_ip }}:6443 K3S_TOKEN={{ master_token }} sh -
  args:
    creates: /usr/local/bin/k3s 


